name: Build DLL and Java (and release new tmx versions)

on:
  push:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon jar

      - name: Collect jar
        run: |
          mkdir -p out-java
          cp java/build/libs/DrivenByMoss4Reaper-*.jar out-java/
          echo "Built from commit $GITHUB_SHA on $(date -u)" > out-java/BUILD-INFO.txt
          ls -la out-java

      - uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: out-java/
          if-no-files-found: error

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        run: cmake -S CMake -B build -A x64 -D CMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter reaper_drivenbymoss.dll | Select-Object -First 1 | Copy-Item -Destination out
          "Built from commit $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File out/BUILD-INFO.txt
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dll-${{ github.sha }}
          path: out/
          if-no-files-found: error

  # Publish a GitHub Release with both files whenever main contains a tmx version that has
  # not been released yet (version comes from reaper_drivenbymoss/TmxVersion.h)
  release:
    if: github.ref == 'refs/heads/main'
    needs: [java, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o '"[0-9][^"]*-tmx[0-9]*"' reaper_drivenbymoss/TmxVersion.h | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          path: artifacts

      - name: Collect release files
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p release
          find artifacts -name 'reaper_drivenbymoss.dll' -exec cp {} release/ \;
          find artifacts -name 'DrivenByMoss4Reaper-*.jar' -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          files: release/*
          body: |
            Unofficial modified build of DrivenByMoss4Reaper (by Jürgen Moßgraber, LGPLv3).
            Not supported by the original author. See the README for what is changed.

            **Install (Windows):** close Reaper, replace `UserPlugins\reaper_drivenbymoss.dll`
            and put the jar into `UserPlugins\drivenbymoss-libs`. Make sure only one
            `DrivenByMoss4Reaper-*.jar` is in that folder (rename backups to `*.jar.original`).
            Both files must be from the same release.
