name: Build DLL and Java (and release on version tags)

on:
  push:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon jar

      - name: Collect jar
        run: |
          mkdir -p out-java
          cp java/build/libs/DrivenByMoss4Reaper-*.jar out-java/
          echo "Built from commit $GITHUB_SHA on $(date -u)" > out-java/BUILD-INFO.txt
          ls -la out-java

      - uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: out-java/
          if-no-files-found: error

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        run: cmake -S CMake -B build -A x64 -D CMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter reaper_drivenbymoss.dll | Select-Object -First 1 | Copy-Item -Destination out
          "Built from commit $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File out/BUILD-INFO.txt
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dll-${{ github.sha }}
          path: out/
          if-no-files-found: error

  # Publish a GitHub Release with both files when a version tag (v...) is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [java, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name 'reaper_drivenbymoss.dll' -exec cp {} release/ \;
          find artifacts -name 'DrivenByMoss4Reaper-*.jar' -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Unofficial modified build of DrivenByMoss4Reaper (by Jürgen Moßgraber, LGPLv3).
            Not supported by the original author. See the README for what is changed.

            **Install (Windows):** close Reaper, replace `UserPlugins\reaper_drivenbymoss.dll`
            and put the jar into `UserPlugins\drivenbymoss-libs`. Make sure only one
            `DrivenByMoss4Reaper-*.jar` is in that folder (rename backups to `*.jar.original`).
            Both files must be from the same release.
