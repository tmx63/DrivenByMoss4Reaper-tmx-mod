name: Build Windows DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        run: cmake -S CMake -B build -A x64 -D CMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter reaper_drivenbymoss.dll | Select-Object -First 1 | Copy-Item -Destination out
          "Built from commit $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File out/BUILD-INFO.txt
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: reaper_drivenbymoss-${{ github.ref_name }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
